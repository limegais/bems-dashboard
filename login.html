<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sign In — BEMS Living Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="login-body" data-theme="light" data-tone="corporate">
  <div class="login-bg-media" aria-hidden="true">
    <img src="assets/images/login-side.png" onerror="this.onerror=null; this.src='assets/images/login-hero.svg';" alt="" />
  </div>

  <div class="login-bg-layer" aria-hidden="true"></div>

  <header class="login-head">
    <p class="login-brand">BEMS Living Lab</p>
  </header>

  <main class="login-main" id="main-content">
    <section class="login-panel">
      <div class="login-panel-inner">
        <p class="login-overline">Authorized Access</p>
        <h1 class="login-title">Welcome to BEMS+</h1>
        <p class="login-subtitle">Smart energy and environmental monitoring platform.</p>

        <form id="login-form" class="login-form-stack">
          <div>
            <label class="login-label" for="login-user">Username</label>
            <input id="login-user" type="text" class="login-input login-input-dark" placeholder="Enter username" autocomplete="username" required />
          </div>

          <div>
            <label class="login-label" for="login-pass">Password</label>
            <div class="relative">
              <input id="login-pass" type="password" class="login-input login-input-dark pr-20" placeholder="Enter password" autocomplete="current-password" required />
              <button id="toggle-pass" type="button" class="login-pass-toggle">Show</button>
            </div>
          </div>

          <div class="login-meta-row">
            <label class="login-check"><input type="checkbox" checked /> Remember Password</label>
            <a href="#" class="login-link">Forgot Password</a>
          </div>

          <label class="login-check login-check-soft"><input type="checkbox" checked /> I have read and agreed to the Service Agreement</label>

          <p id="login-error" class="text-xs text-red-300 hidden">Invalid username or password.</p>

          <button id="login-submit" type="submit" class="login-submit">Sign In</button>

          <div class="relative flex py-1.5 items-center">
            <div class="flex-grow border-t border-slate-700/60"></div>
            <span class="flex-shrink mx-3 text-slate-400 text-[11px] font-mono">atau</span>
            <div class="flex-grow border-t border-slate-700/60"></div>
          </div>

          <button id="login-guest-btn" type="button" class="w-full py-2.5 px-4 rounded-xl border border-teal-500/40 bg-teal-500/10 hover:bg-teal-500/20 text-teal-300 hover:text-white font-semibold text-xs transition-all flex items-center justify-center gap-2 cursor-pointer shadow-sm">
            <svg class="w-4 h-4 text-teal-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span>Masuk sebagai Tamu (Guest) — Isi Form Kenyamanan</span>
          </button>
        </form>

        <div class="login-panel-foot">
          <a href="#" class="login-link">Terms of Use</a>
          <a href="#" class="login-link">Privacy Policy</a>
          <a href="#" class="login-link">Cookies Policy</a>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/config/app-config.js?v=9"></script>
  <script src="assets/js/core/session.js?v=9"></script>
  <script src="assets/js/core/api-client.js?v=9"></script>
  <script src="assets/js/mock/accounts.js?v=9"></script>
  <script src="assets/js/services/auth-service.js?v=9"></script>
  <script src="assets/js/pages/login.js?v=9"></script>
</body>
</html>
